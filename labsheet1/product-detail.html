<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DairyShop - Product Details</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">
        🥛 DairyShop
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="cart.html">
            Cart 🛒
            <span id="cartCount">0</span>
        </a>

    </nav>

</header>


<section class="container">


    <div class="product-detail">


        <div>

            <img
                src="https://via.placeholder.com/400x300?text=Fresh+Milk"
                alt="Fresh Milk"
            >

        </div>


        <div class="details">

            <h1>
                Fresh Milk
            </h1>


            <p class="price">
                ₹60 / litre
            </p>


            <p>
                Our fresh milk is pure, healthy and collected
                from trusted dairy farms. It is delivered fresh
                to your doorstep.
            </p>


            <br>


            <label for="quantity">
                Quantity:
            </label>


            <select id="quantity">

                <option value="1">
                    1
                </option>

                <option value="2">
                    2
                </option>

                <option value="3">
                    3
                </option>

                <option value="4">
                    4
                </option>

                <option value="5">
                    5
                </option>

            </select>


            <br><br>


            <a
                href="products.html"
                class="btn">
                Add to Cart
            </a>


        </div>


    </div>


</section>


<footer>

    <p>
        Contact: support@dairyshop.com |
        Phone: 9876543210
    </p>

    <p>
        © 2026 DairyShop. All Rights Reserved.
    </p>

</footer>


<script src="script.js"></script>


</body>
</html>
