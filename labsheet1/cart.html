<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DairyShop - Cart</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">
        🥛 DairyShop
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="cart.html">
            Cart 🛒
            <span id="cartCount">0</span>
        </a>

    </nav>

</header>


<section class="container">

    <h2>
        Shopping Cart
    </h2>


    <table>

        <thead>

            <tr>

                <th>
                    Product
                </th>

                <th>
                    Quantity
                </th>

                <th>
                    Price
                </th>

                <th>
                    Subtotal
                </th>

                <th>
                    Action
                </th>

            </tr>

        </thead>


        <tbody id="cartContainer">

            <!-- JavaScript will add cart items -->

        </tbody>


        <tfoot>

            <tr class="total">

                <td colspan="3">
                    Grand Total
                </td>

                <td id="grandTotal">
                    ₹0
                </td>

                <td>
                </td>

            </tr>

        </tfoot>


    </table>


    <div class="checkout-btn">

        <a
            href="checkout.html"
            class="btn">
            Proceed to Checkout
        </a>

    </div>


</section>


<footer>

    <p>
        Contact: support@dairyshop.com |
        Phone: 9876543210
    </p>

    <p>
        © 2026 DairyShop. All Rights Reserved.
    </p>

</footer>


<script src="script.js"></script>


</body>
</html>
